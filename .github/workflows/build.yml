name: build-test-package

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The job never pushes. Do not leave GITHUB_TOKEN credentials available to build tools.
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test React utilities
        run: npm test

      - name: Type-check and build React
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust domain and persistence
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build per-user NSIS installer
        # npm's first `--` forwards to Tauri; Tauri's second `--` forwards to Cargo.
        run: npm run tauri -- build -- --locked

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WorkdayTracker-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
